<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C4 Dashboard - Send Center</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/c5-views.css">
    <link rel="stylesheet" href="css/c5-main.css">
    <link rel="stylesheet" href="css/mapa-calor.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <script>
        if (window.history.replaceState) {
            window.history.replaceState(null, null, "/");
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <script>
        // VERIFICACIÓN DE SESIÓN MEJORADA (Gatekeeper)
        (function () {
            function checkSession() {
                const token = localStorage.getItem('token');
                const user = localStorage.getItem('user');

                if (!token || !user) {
                    window.location.replace('index.html');
                }
            }

            // Ejecutar al cargar y al volver atrás (bfcache)
            window.addEventListener('pageshow', function (event) {
                checkSession();
            });

            checkSession();
        })();
    </script>
</head>

<body>

    <style>
        /* Pantalla de carga inicial a pantalla completa */
        #session-loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e7eb 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2c3e50;
        }

        #session-loading-overlay i {
            font-size: 3rem;
            color: #3498db;
            margin-bottom: 20px;
        }

        #session-loading-overlay h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        #session-loading-overlay p {
            font-size: 1rem;
            color: #7f8c8d;
        }
    </style>

    <div id="session-loading-overlay">
        <i class="fas fa-shield-alt fa-flip"></i>
        <h2>SAS C4</h2>
        <p>Verificando conexión segura...</p>
    </div>

    <div id="app-container" class="app-container dashboard-layout" style="display: none;">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <h1>SAS C4</h1>
                </div>
            </div>

            <div class="sidebar-menu-category">MENÚ PRINCIPAL</div>
            <nav class="sidebar-nav" id="main-nav">
                <ul>
                    <li><a href="#" id="nav-dashboard" class="active"><i class="fas fa-home"></i>
                            <span>Dashboard</span></a></li>
                    <li><a href="#" id="nav-llamadas"><i class="fas fa-headset"></i> <span>Registrar</span></a></li>
                    <li><a href="#" id="nav-mapacalor"><i class="fas fa-map-marked-alt"></i> <span>Mapa Calor</span></a>
                    </li>
                    <li><a href="#" id="nav-c5"><i class="fas fa-satellite-dish"></i> <span>Enviar a C5</span></a></li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar">
                        <i class="fas fa-user-shield"></i>
                    </div>
                    <div class="user-details">
                        <span class="user-name" id="user-name">Cargando...</span>
                        <span class="user-role">Operador Central</span>
                    </div>
                </div>
                <a href="#" id="logout-btn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> <span>Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <main class="main-content">

            <div class="mobile-header">
                <div class="logo-mobile">
                    <i class="fas fa-shield-alt"></i> SAS C4
                </div>
                <button class="mobile-menu-btn" id="mobile-menu-btn">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

            <div class="content-wrapper">
                <div id="content">

                    <div class="loading-container">
                        <i class="fas fa-circle-notch fa-spin fa-3x"></i>
                        <p style="margin-top: 15px;">Cargando sistema operativo...</p>
                    </div>
                </div>

                <div class="institutional-footer"
                    style="padding: 20px 0; border-top: 1px solid var(--border-soft); margin-top: auto; text-align: center; color: var(--text-muted); font-size: 0.85rem;">
                    <span>© 2026 Sistema de Gestión de Emergencias</span>
                    <span style="margin: 0 10px;">•</span>
                    <span style="font-weight: 600; color: var(--c-primary-dark);">BETA 2.0</span>
                </div>
            </div>
        </main>
    </div>

    <script src="js/config/app.config.js" defer></script>

    <script src="js/utils/helpers.js" defer></script>
    <script src="js/utils/api.js" defer></script>
    <script src="js/utils/formatters.js" defer></script>
    <script src="js/utils/notifications.js" defer></script>
    <script src="js/utils/exporters.js" defer></script>
    <script src="js/utils/printManager.js" defer></script>

    <script src="js/components/ToastNotifications.js" defer></script>
    <script src="js/components/ModalManager.js" defer></script>
    <script src="js/components/LoadingOverlay.js" defer></script>
    <script src="js/components/ConfirmDialog.js" defer></script>

    <script src="js/services/LlamadasService.js" defer></script>
    <script src="js/services/C5Service.js" defer></script>

    <script src="js/views/DashboardView.js" defer></script>
    <script src="js/views/MapaCalorView.js" defer></script>
    <script src="js/views/LlamadasView.js" defer></script>

    <script src="js/views/LoginView.js" defer></script>

    <script src="js/views/c5/C5MainView.js" defer></script>
    <script src="js/views/c5/C5NewView.js" defer></script>
    <script src="js/views/c5/C5ListView.js" defer></script>
    <script src="js/views/c5/C5SuccessView.js" defer></script>
    <script src="js/views/c5/C5DetailsView.js" defer></script>
    <script src="js/views/C5View.js" defer></script>
    <script src="js/views/AdminSettingsView.js" defer></script>

    <script src="js/app.js" defer></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 1. Actualizar nombre de usuario
            const user = localStorage.getItem('user');
            if (user) {
                try {
                    const userData = JSON.parse(user);
                    const userName = userData.nombre || userData.username || 'Operador';
                    const userTurno = userData.turno || 'General';

                    const userNameEl = document.getElementById('user-name');
                    if (userNameEl) {
                        userNameEl.textContent = `${userName} | Turno ${userTurno}`;
                    }
                } catch (e) {
                    const userNameEl = document.getElementById('user-name');
                    if (userNameEl) {
                        userNameEl.textContent = 'Operador';
                    }
                }
            }

            // 2. Actualizar año de copyright
            const currentYear = new Date().getFullYear();
            const copyrightEl = document.getElementById('copyright-text');
            if (copyrightEl) {
                copyrightEl.textContent =
                    `Sistema de Gestión de Emergencias © ${currentYear} - Todos los derechos reservados`;
            }

            // 3. Manejar botón de logout
            document.getElementById('logout-btn')?.addEventListener('click', function (e) {
                e.preventDefault();
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.replace('index.html');
            });

            // 4. Manejar navegación (si app.js no está cargado)
            document.getElementById('nav-dashboard')?.addEventListener('click', function (e) {
                e.preventDefault();
                if (window.app && window.app.loadView) {
                    window.app.loadView('dashboard');
                }
            });

            document.getElementById('nav-llamadas')?.addEventListener('click', function (e) {
                e.preventDefault();
                if (window.app && window.app.loadView) {
                    window.app.loadView('llamadas');
                }
            });

            document.getElementById('nav-c5')?.addEventListener('click', function (e) {
                e.preventDefault();
                if (window.app && window.app.loadView) {
                    window.app.loadView('c5');
                }
            });

            // 5. Ajustar altura del contenido cuando se carga
            function adjustContentHeight() {
                const content = document.getElementById('content');
                const main = document.querySelector('main');

                if (content.children.length > 1 || content.innerHTML.includes('dashboard') ||
                    content.innerHTML.includes('view')) {
                    content.classList.add('loaded');
                    main.style.minHeight = 'auto';
                }
            }

            // Verificar cada segundo si se cargó contenido
            setTimeout(adjustContentHeight, 1000);
            setInterval(adjustContentHeight, 3000);

            // 6. Toggle Mobile Sidebar
            const mobileMenuBtn = document.getElementById('mobile-menu-btn');
            const sidebar = document.getElementById('sidebar');
            if (mobileMenuBtn && sidebar) {
                mobileMenuBtn.addEventListener('click', function () {
                    sidebar.classList.toggle('mobile-open');
                });
            }
        });
    </script>

</body>

</html>
